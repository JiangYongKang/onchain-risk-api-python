[project]
name = "onchain-risk-api-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
addopts = "-ra -v"
testpaths = ["tests"]
markers = [
    "dryrun: rule trial run scenarios",
    "diff: version diff scenarios",
    "isolation: dry-run vs concurrent writes/queries",
    "limits: capacity and partial coverage",
    "regression: pre-existing behaviours that must not regress",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
